spring.application.name=SKYROM
server.servlet.context-path=/
server.port=8188

end.point.npc=/npc
end.point.all=/all
end.point.create=/create


spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate


logging.level.root=INFO
logging.level.ch_service=DEBUG
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] --- [%15.15t] %-40.40logger{39} : %m%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] --- [%15.15t] %-40.40logger{39} : %m%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

spring.flyway.locations=classpath:migrations